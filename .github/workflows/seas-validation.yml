name: SEAS Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-system:
    runs-on: ubuntu-latest
    
    services:
      # Optional: Add redis/postgres if used, but we use SQLite
      
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Backend Dependencies
      run: |
        pip install -r backend/requirements.txt
        pip install pytest pytest-asyncio httpx locust

    - name: Install Tesseract
      run: sudo apt-get install -y tesseract-ocr

    - name: Initialize Database and Fixtures
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        python scripts/generate_test_data.py
      env:
        DATABASE_URL: sqlite:///./backend/exam_system.db
        SECRET_KEY: test-secret

    - name: Run API Tests
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        pytest -v tests/test_api.py

    - name: Run Load Test
      run: |
        # Start server in background
        export PYTHONPATH=$PYTHONPATH:./backend
        python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 &
        sleep 5
        # Run locust
        locust -f tests/locustfile.py --headless -u 10 -r 2 --run-time 30s --host http://localhost:8000 --only-summary

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run E2E Tests
      run: |
        # Frontend already running? No, start it
        cd frontend && npm run dev & 
        sleep 10
        npx playwright test tests/e2e/exam_simulation.spec.ts
