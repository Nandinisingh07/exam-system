version: '3.8'

services:
  backend:
    build: ./backend
    container_name: seas-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/db:/app/db
      - ./backend/uploads:/app/uploads
    environment:
      - DATABASE_URL=sqlite:///./db/exam_system.db
      - SECRET_KEY=prod-secret-key-change-this
      - ALGORITHM=HS256
      - TESSERACT_CMD=/usr/bin/tesseract
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: seas-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: seas-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: seas-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
